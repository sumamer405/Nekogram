name: Build Nekogram APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/* /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;37.0.0 ndk;27.3.13750724 platforms;android-37.0 cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties

      - name: Generate Keystore & Configure Properties
        run: |
          keytool -genkey -v -keystore keystore.jks -alias nekogram -keyalg RSA -keysize 2048 -validity 10000 -storepass nekopass -keypass nekopass -dname "CN=Nekogram, OU=Neko, O=Neko, L=City, S=State, C=US"
          
          echo "storeFile=${{ github.workspace }}/keystore.jks" >> local.properties
          echo "storePassword=nekopass" >> local.properties
          echo "keyAlias=nekogram" >> local.properties
          echo "keyPassword=nekopass" >> local.properties
          echo "apiId=6" >> local.properties
          echo "apiHash=eb06d4abfb49dc3eeb1aeb98ae0f581e" >> local.properties
          echo "mapsApiKey=" >> local.properties
          touch sentry.properties

      - name: Build APK with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nekogram-ProxyAuto-arm64-v8a
          path: TMessagesProj_App/build/outputs/apk/release/*.apk
          if-no-files-found: error
